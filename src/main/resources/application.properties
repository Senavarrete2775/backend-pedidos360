spring.application.name=backend-pedidos360-tnt
server.port=8080

# Azure AD (IDaaS) Configuration
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=bb5324af-c266-41ed-b36c-a971641c7af2
spring.cloud.azure.active-directory.credential.client-id=979b7949-f63b-4e7c-baa8-e382982acee6
spring.cloud.azure.active-directory.app-id-uri=api://979b7949-f63b-4e7c-baa8-e382982acee6

# Base de Datos Cloud / Persistencia (H2 en memoria por defecto para demo local/EC2)
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (accesible en /h2-console para revisión del docente)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
