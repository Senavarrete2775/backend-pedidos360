# Solo PostgreSQL. RabbitMQ y Kafka están en backend-pedidos360/infra/
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-pedidos360
    restart: always
    ports:
      - "5433:5432"   # 5433 en el host: evita choque con un PostgreSQL instalado en Windows
    environment:
      POSTGRES_DB: pedidosdb
      POSTGRES_USER: ${DB_USERNAME:-pedidos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pedidos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pedidos} -d pedidosdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
